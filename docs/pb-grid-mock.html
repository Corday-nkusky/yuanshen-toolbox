}
function badge(){
  document.getElementById("lv").innerHTML = ["b","i","e"].map(k =>
    `<button class="${k===lv?"on":""}" onclick="setLv('${k}')">${D.cn[k]}</button>`).join("");
  document.getElementById("bd").innerHTML = `<button class="on">全PB</button><button disabled title="预览页只做了全PB">NF PB</button>`;
  document.getElementById("mt").innerHTML = METRICS.map(([k,s]) =>
    `<button class="${k===metric?"on":""}" onclick="setM('${k}')">${s}</button>`).join("");
  const ramp = ramps[lv];
  document.getElementById("lg").innerHTML =
    [["本级最快",ramp[0]],["偏快",ramp[1]],["偏慢",ramp[2]],["较慢",ramp[3]],["没有成绩",EMPTY]]
    .map(([s,c]) => `<span><i style="background:${c}"></i>${s}</span>`).join("");
}
function render(){
  const rows = D.data[lv];
  const bvs = Object.keys(rows).map(Number);
  const lo = Math.floor(Math.min(...bvs)/10)*10, hi = Math.floor(Math.max(...bvs)/10)*10;
  const out = ['<div class="hd"></div>'];
  for (let c=0;c<10;c++) out.push(`<div class="hd">${c}</div>`);
    for (let s=lo;s<=hi;s+=10){
    out.push(`<div class="lb">${s}–${s+9}</div>`);
    for (let c=0;c<10;c++){
      const bv = s+c, r = rows[bv];
      if (bv < 1){ out.push(`<div class="cell" style="background:transparent"></div>`); continue; }
      if (!r){ out.push(`<div class="cell" style="background:${EMPTY};color:#cfbec9">·</div>`); continue; }
      const [bg,fg] = tone(r);
      const gate = bv < GATE[lv] ? "outline:1px dashed #d9c6d2;outline-offset:-2px;" : "";
      out.push(`<div class="cell" data-bv="${bv}" style="background:${bg};color:${fg};${gate}"
        onmouseenter="peek(${bv})" onmouseleave="unprobe()" onclick="pick(${bv})">${fmt(r,metric)}</div>`);
    }
  }
  document.getElementById("grid").innerHTML = out.join("");
  const n = bvs.length, span = hi + 10 - Math.max(1, lo);
  document.getElementById("hint").textContent = `${n} / ${span} 个位置有成绩`;
  showDetail(Number(document.querySelector(".cell[data-bv]")?.dataset.bv || bvs[0]));
}
function showDetail(bv){
  const r = D.data[lv][bv];
  document.querySelectorAll(".cell").forEach(e => e.classList.toggle("sel", +e.dataset.bv === bv));
  const el = document.getElementById("detail");
  if (!r){ el.innerHTML = `<b>BV ${bv}</b><span>这个位置还没有成绩</span>`; return; }
  el.innerHTML = `<b>BV ${bv}</b>
    <span>最快</span>${r.t.toFixed(3)} s
    <span>3BV/s</span>${r.bvs.toFixed(2)}
    <span>stnb</span>${r.stnb.toFixed(1)}
    <span>排名</span>${r.rank ? r.rank + " / " + (r.count||"?") : "—"}
    <span class="f">本级别共 ${Object.keys(D.data[lv]).length} 个 BV 有成绩</span>`;
}
function pick(bv){ showDetail(bv); }
function peek(bv){
  const r = D.data[lv][bv];
  document.querySelectorAll(".cell").forEach(e => e.classList.toggle("probe", r && +e.dataset.bv === bv));
}
function unprobe(){ document.querySelectorAll(".cell.probe").forEach(e => e.classList.remove("probe")); }
function setLv(k){ lv = k; badge(); render(); }
function setM(k){ metric = k; badge(); render(); }
badge(); render();
</script></body></html>
